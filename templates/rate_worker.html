{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3 class="text-center">Rate Worker</h3>
                </div>
                <div class="card-body">
                    <div class="text-center mb-4">
                        <h4>Rate {{ application.applicant.name }}</h4>
                        <p class="text-muted">Job: {{ application.job.title }}</p>
                    </div>
                    
                    <form method="POST" action="{{ url_for('rate_worker', application_id=application.id) }}">
                        <div class="form-group mb-4">
                            <label class="form-label">Rating</label>
                            <div class="rating">
                                {% for i in range(5, 0, -1) %}
                                <input type="radio" name="rating" value="{{ i }}" id="star{{ i }}" required>
                                <label for="star{{ i }}">☆</label>
                                {% endfor %}
                            </div>
                        </div>
                        
                        <div class="form-group mb-4">
                            <label for="comment" class="form-label">Comments (Optional)</label>
                            <textarea class="form-control" id="comment" name="comment" rows="4" placeholder="Share your experience with this worker..."></textarea>
                        </div>
                        
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary">Submit Rating</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.rating {
    display: flex;
    flex-direction: row-reverse;
    justify-content: flex-end;
    gap: 0.3rem;
}

.rating input {
    display: none;
}

.rating label {
    font-size: 2rem;
    color: #ddd;
    cursor: pointer;
    transition: color 0.2s;
}

.rating label:hover,
.rating label:hover ~ label,
.rating input:checked ~ label {
    color: #ffd700;
}
</style>
{% endblock %}
