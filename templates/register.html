{% extends "base.html" %}

{% block title %}Register{% endblock %} 

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const userTypeSelect = document.getElementById('user_type');
        const workerFields = document.querySelectorAll('.worker-field');
        
        // Function to toggle worker-specific fields
        function toggleWorkerFields() {
            const isWorker = userTypeSelect.value === 'worker';
            workerFields.forEach(field => {
                field.style.display = isWorker ? 'block' : 'none';
            });
        }
        
        // Initial toggle
        toggleWorkerFields();
        
        // Toggle on change
        userTypeSelect.addEventListener('change', toggleWorkerFields);
    });
</script>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Register</h3>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="phone" name="phone" required>
                    </div>
                    <div class="mb-3">
                        <label for="user_type" class="form-label">I am a:</label>
                        <select class="form-select" id="user_type" name="user_type" required>
                            <option value="worker">Worker</option>
                            <option value="employer">Employer</option>
                        </select>
                    </div>
                    
                    <div class="mb-3 worker-field" style="display: none;">
                        <label class="form-label">Do you have access to a smartphone?</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="has_smartphone" id="has_smartphone_yes" value="yes" checked>
                            <label class="form-check-label" for="has_smartphone_yes">
                                Yes, I have a smartphone
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="has_smartphone" id="has_smartphone_no" value="no">
                            <label class="form-check-label" for="has_smartphone_no">
                                No, I prefer SMS notifications
                            </label>
                        </div>
                    </div>

                    <div class="mb-3 worker-field" style="display: none;">
                        <label for="location" class="form-label">Your Location</label>
                        <input type="text" class="form-control" id="location" name="location" placeholder="e.g., Mumbai, Maharashtra">
                        <div class="form-text">Enter your city and state</div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Register</button>
                </form>
                <div class="text-center mt-3">
                    <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
